[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-hologotchi-host"
version = "0.1.0"
description = "Minimal Phase 4 host service for esp-hologotchi"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hologotchi-host = "host.__main__:main"

[tool.setuptools.packages.find]
include = ["host*"]
exclude = ["host.tests*"]
